<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lúmen Fintech</title>

    <link rel="icon" type="image/png" href="./images/favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo-area">
            <img src="./images/logo-lumen.png" alt="Logo Lúmen" class="logo-img">
        </div>

        <div class="header-content">
            <nav class="menu">
                <a href="#">Relatórios</a>
                <a href="#">Configurações</a>
            </nav>

            <div class="user-box">
                <img src="https://i.pravatar.cc/80?img=5" alt="Foto do usuário" class="avatar-img">

                <div>
                    <p class="user-name">Laura Santos</p>
                    <p class="user-status">Conectado</p>
                </div>
            </div>

            <input class="search" type="text" placeholder="Search in site">

            <a href="index.html" class="nav-icon nav-home">⌂</a>
            <a href="#" class="nav-icon nav-close">×</a>
        </div>
    </header>

    <main class="container">

        <section>
            <h1 class="titulo">Relatórios Financeiros</h1>
        </section>

        <section class="filtros">
            <div class="filtro-grupo">
                <label>Data Inicial</label>

                <select id="mesInicial" aria-label="Mês inicial">
                    <option value="0">Jan</option><option value="1">Fev</option><option value="2">Mar</option><option value="3">Abr</option><option value="4">Mai</option><option value="5">Jun</option><option value="6">Jul</option><option value="7">Ago</option><option value="8" selected>Set</option><option value="9">Out</option><option value="10">Nov</option><option value="11">Dez</option>
                </select>

                <select id="anoInicial" aria-label="Ano inicial"><option>2025</option><option selected>2026</option></select>
            </div>

            <div class="filtro-grupo">
                <label>Data Final</label>

                <select id="mesFinal" aria-label="Mês final">
                    <option value="0">Jan</option><option value="1">Fev</option><option value="2">Mar</option><option value="3">Abr</option><option value="4">Mai</option><option value="5">Jun</option><option value="6">Jul</option><option value="7">Ago</option><option value="8">Set</option><option value="9" selected>Out</option><option value="10">Nov</option><option value="11">Dez</option>
                </select>

                <select id="anoFinal" aria-label="Ano final"><option>2025</option><option selected>2026</option></select>
            </div>

            <button class="btn" id="btnFiltrar" type="button">Filtrar</button>
            <button class="btn btn-ir" id="btnResumoAnual" type="button">Resumo Anual IR</button>
        </section>

        <section class="cards">
            <div class="card">
                <h2>Distribuição por Categoria</h2>

                <div class="grafico-container">
                    <div class="grafico-area">
                        <div class="grafico grafico-padrao" id="graficoCategorias" role="img" aria-label="Distribuição de despesas por categoria"></div>
                    </div>

                    <div class="legenda-grafico" id="legendaCategorias"><p>Carregando dados...</p></div>
                </div>
            </div>

            <div class="card">
                <h2>Total por Categoria</h2>

                <div class="lista-categorias" id="listaCategorias"><p>Carregando dados...</p></div>
            </div>
        </section>

        <section class="resumo">
            <h2>Resumo Geral dos Gastos</h2>

            <div class="cards resumo-cards">
                <div class="card">
                    <p>Total Gastos</p>
                    <p class="valor" id="totalGastos">—</p>
                </div>

                <div class="card">
                    <p>Média Semanal</p>
                    <p class="valor" id="mediaSemanal">—</p>
                </div>

                <div class="card">
                    <p>Gastos em Alta</p>
                    <p class="valor" id="gastoEmAlta">—</p>
                </div>
            </div>
        </section>

        <p id="statusApi" class="status-api" role="status">Conectando à API...</p>
    </main>

    <script src="./js/script.js"></script>
</body>
</html>
